name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app_db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: lint（境界ルール含む）
        run: npm run lint

      - name: check:boundaries（§8.1 依存方向）
        run: npm run check:boundaries

      - name: check:core-freeze（§8.2 コア凍結）
        if: github.event_name == 'pull_request'
        run: npm run check:core-freeze

      - name: 型チェック
        run: npm run build

      - name: DBマイグレーション適用
        run: npm run db:migrate

      - name: 共通コントラクト＋fixtureテスト（DBリポジトリの統合テスト含む）
        run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: ビルド（型チェック込み）
        run: npm run build

      - name: コンポーネントテスト
        run: npm test
