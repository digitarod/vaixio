# 管理者スコープ。ハブ自身の自己診断ツール（§6.4）専用。
# Bearer トークンは vault://admin/mcp_token → 環境変数 VAULT__ADMIN__MCP_TOKEN で注入する。
customer: admin
mcp_path: /mcp/admin
allowed_tools:
  - vaixio.health
  - vaixio.errors.recent
  - vaixio.trace.get
  - vaixio.replay
  - vaixio.connector.smoke
credentials: {}
confirm_policy:
  destructive: dry_run_first
audit: true
